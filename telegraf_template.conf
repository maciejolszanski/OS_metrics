[agent]
  interval = "5s"

[[inputs.cpu]]
  percpu = false
  totalcpu = true

[[inputs.mem]]

[[outputs.file]]
  files = ["${RAW_METRICS_PATH}/cpu_<date_placeholder>.csv", "stdout"]
  data_format = "csv"
  csv_header = true
  namepass = ["cpu"]

[[outputs.file]]
  files = ["${RAW_METRICS_PATH}/mem_<date_placeholder>.csv", "stdout"]
  data_format = "csv"
  csv_header = true
  namepass = ["mem"]